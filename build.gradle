plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = 'cloudgram'
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cloudgram" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "com.google.code.gson:gson:2.11.0"
	testImplementation "com.google.code.gson:gson:2.11.0"
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

def modVersion = project.version

/**
 * Forwards development self-test switches to the forked client, e.g.
 * {@code gradlew runClient -Pcloudgram.selftest.openRestore=true}.
 */
tasks.matching { it.name == 'runClient' }.configureEach {
	['openSetup', 'openRestore', 'leaveAfterTicks'].each { hook ->
		def property = "cloudgram.selftest.${hook}"
		if (project.hasProperty(property)) {
			systemProperty property, project.property(property)
		}
	}
}

processResources {
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
